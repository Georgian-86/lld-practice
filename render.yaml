# Render Blueprint: New → Blueprint → pick this repo → Apply.
# One Docker web service (API + web app + evaluation worker in one process) on
# Render's FREE plan. The free plan has no persistent disk, so data lives in an
# external Postgres (e.g. a free Supabase project) given as DATABASE_URL.
# Without DATABASE_URL the app still runs, on a local SQLite file that is wiped
# whenever the free instance restarts or sleeps.
services:
  - type: web
    name: blueprint-lld
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    autoDeploy: true # every push to the deployed branch redeploys
    healthCheckPath: /api/health
    envVars:
      # Secrets: you are asked for them once, when the Blueprint is created. Never commit them.
      - key: GROQ_API_KEY
        sync: false
      - key: DATABASE_URL # Supabase → Connect → "Session pooler" connection string (IPv4)
        sync: false
      # Non-secret settings (the Dockerfile sets PORT).
      - key: NODE_ENV
        value: production
      - key: LLM_PROVIDER
        value: auto # Groq when GROQ_API_KEY is set; add ANTHROPIC_API_KEY later to switch to Claude
      - key: LLM_TIMEOUT_MS
        value: "60000"
      - key: WORKER_CONCURRENCY
        value: "2"
      - key: LOG_LEVEL
        value: info
